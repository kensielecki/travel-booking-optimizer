<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Booking Optimizer Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Travel Booking Optimizer</p>
        <h1>Capture visible rewards data</h1>
      </header>

      <section class="panel">
        <label>
          API URL
          <input id="apiUrl" value="http://127.0.0.1:8000" />
        </label>
        <label>
          Demo user ID
          <input id="userId" value="11111111-1111-4111-8111-111111111111" />
        </label>
      </section>

      <section class="toolbar">
        <button id="captureButton" type="button">Capture tab</button>
        <button id="sendButton" type="button" class="secondary">Send</button>
      </section>

      <section class="panel">
        <label>
          Correct points balance
          <input id="balanceOverride" inputmode="numeric" placeholder="Optional" />
        </label>
        <button id="applyOverrideButton" type="button" class="secondary">Apply correction</button>
      </section>

      <section class="panel">
        <div class="row">
          <span>Status</span>
          <strong id="status">Ready</strong>
        </div>
        <div class="row">
          <span>Detected</span>
          <strong id="detected">None</strong>
        </div>
      </section>

      <label>
        Normalized payload
        <textarea id="payload" spellcheck="false"></textarea>
      </label>
    </main>

    <script src="parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
