<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Amex Membership Rewards Page</title>
    <style>
      body {
        margin: 0;
        background: #f6f7f9;
        color: #15171a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      section {
        margin-top: 18px;
        border: 1px solid #d9dde3;
        border-radius: 8px;
        background: #fff;
        padding: 18px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        margin-bottom: 10px;
        font-size: 18px;
      }

      p {
        margin-top: 8px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>American Express Membership Rewards</h1>

      <section>
        <h2>Rewards balance</h2>
        <p>Available points: 110,000</p>
      </section>

      <section>
        <h2>Amex Offers</h2>
        <p>Hilton: Spend $500 or more, get $100 back as a statement credit.</p>
        <p>United: Spend $300, receive $75 back on eligible airfare.</p>
      </section>
    </main>
  </body>
</html>
